configs:
  params:
    # TLS is terminated by the ingress (plain HTTP locally).
    server.insecure: true
  cm:
    # Report the health of child Applications, so sync waves in the app-of-apps wait
    # for e.g. PostgreSQL to be healthy before syncing the apps that use it.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localtest.me

# Single replicas are enough for a laptop.
dex:
  enabled: false
notifications:
  enabled: false
