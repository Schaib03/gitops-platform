apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
spec:
  groups:
    - name: payflow
      rules:
        - alert: PayflowHighErrorRate
          expr: |
            sum(rate(django_http_responses_total_by_status_total{namespace="payflow", status=~"5.."}[5m]))
              / clamp_min(sum(rate(django_http_responses_total_by_status_total{namespace="payflow"}[5m])), 1e-9)
              > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: More than 5% of PayFlow responses are 5xx.
        - alert: PayflowWebhookDeliveriesFailing
          expr: |
            sum(rate(payflow_webhook_delivery_attempts_total{result="failure"}[15m]))
              / clamp_min(sum(rate(payflow_webhook_delivery_attempts_total[15m])), 1e-9)
              > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Most webhook deliveries are failing; merchants may not be notified.
        - alert: PayflowWorkerDown
          expr: sum(kube_deployment_status_replicas_available{namespace="payflow", deployment=~".*-worker"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No Celery worker is running, webhooks are queuing up.
    - name: corebank
      rules:
        - alert: CorebankDown
          expr: sum(up{namespace="corebank"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Prometheus cannot scrape any CoreBank pod.
        - alert: CorebankHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{application="corebank-api", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{application="corebank-api"}[5m])), 1e-9)
              > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: More than 5% of CoreBank requests fail with 5xx.
        - alert: CorebankDatabasePoolExhausted
          expr: max(hikaricp_connections_pending{application="corebank-api"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Requests are waiting for a database connection.
