{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "payflow.fullname" . }}-web
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "payflow.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
{{- end }}
