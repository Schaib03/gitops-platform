apiVersion: v1
kind: Service
metadata:
  name: {{ include "payflow.fullname" . }}-web
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "payflow.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
